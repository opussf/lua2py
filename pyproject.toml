[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lua2py"
version = "0.1.0"
description = "Lua2Py Lua tables to Python dictionaries back to Lua tables."
authors = [
    {name = "Opussf", email = "github@zz9-za.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14"
keywords = ["Lua", "Tables"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Runtime dependencies
dependencies = [
    "requests>=2.28.0",
]

# Optional dependencies for development
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

# If you have console scripts/entry points
[project.scripts]
my-command = "my_project.main:main"

# Package discovery
[tool.setuptools.packages.find]
where = ["."]
include = ["Lua2Py*","lua2py*"]
